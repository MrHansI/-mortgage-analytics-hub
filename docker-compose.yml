# Expose the public UI only via an HTTPS reverse proxy. Port 8000 binds to localhost.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mortgage
      POSTGRES_USER: mortgage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgage -d mortgage"]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://mortgage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mortgage
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a random ADMIN_TOKEN (32+ characters)}
      AUTO_SYNC_ON_START: "0"
    volumes:
      - downloads_data:/service/downloads
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness',timeout=5).read()"]
      interval: 30s
      timeout: 7s
      start_period: 20s
      retries: 3

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "schedule", "--config", "config/targets.json"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://mortgage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mortgage
      AUTO_SYNC_ON_START: "0"
    volumes:
      - downloads_data:/service/downloads
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  downloads_data:
